<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./assets/css/Styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Blog preview card</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div role="container-principal" class="container-principal">
      <div role="imagen" class="imagen-principal">
        <img
          src="./assets/images/illustration-article.svg"
          alt="Web 3"
          class="image-web-3"
        />
      </div>
      <div role="button" class="button-title">Learning</div>

      <div role="contentinfo-date" class="title-date">Published 21 Dec 2023</div>
      <div role="contentinfo-title-link" class="title-link-pointer">HTML & CSS foundations</div>
      <div role="article" class="article-principal"> These languages are the backbone of every <br> website, defining structure, content, and <br> presentation. </div>
      <div role="perfil" class="perfil">
        <div role="image-perfil"><img src="./assets/images/image-avatar.webp" class="image-perfil" alt=""></div>
        <div role="doc-credits" class="personaje">Greg Hooper</div>
      </div>
    </div>
  </body>
</html>
